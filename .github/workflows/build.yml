name: Build FareOrders

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: FareOrders
          path: target/FareOrders.jar
